<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feature Cards</title>
</head>
<body style="margin:0;padding:48px 24px;background:#0A0A0B;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;box-sizing:border-box">

<div style="display:flex;flex-wrap:wrap;gap:12px;width:100%;max-width:936px;justify-content:center">

  <!-- Card 1: purple → lavender → orange -->
  <div style="position:relative;width:300px;flex:0 0 300px">
    <div style="position:absolute;inset:0;height:300px;border-radius:40px;opacity:.6;filter:blur(45px);background:linear-gradient(137deg,#7c3aed 0%,#c084fc 45%,#f97316 100%)"></div>
    <div style="position:relative;height:300px;border-radius:40px;border:8px solid transparent;background:linear-gradient(#1A1A1C,#1A1A1C) padding-box,linear-gradient(137deg,#7c3aed 0%,#c084fc 45%,#f97316 100%) border-box;overflow:hidden;z-index:1">
      <div style="padding:28px;height:100%;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box">
        <div style="color:rgba(255,255,255,.9)">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </div>
        <div>
          <div style="color:#fff;font-weight:500;font-size:20px;letter-spacing:-.025em;margin-bottom:12px">Hardware</div>
          <p style="color:#9ca3af;font-size:14px;line-height:1.6;margin:0">My entire desktop setup is built for power. It is silent, durable, and holds my focus.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Card 2: orange → amber → purple -->
  <div style="position:relative;width:300px;flex:0 0 300px">
    <div style="position:absolute;inset:0;height:300px;border-radius:40px;opacity:.6;filter:blur(45px);background:linear-gradient(137deg,#f97316 0%,#fb923c 50%,#7c3aed 100%)"></div>
    <div style="position:relative;height:300px;border-radius:40px;border:8px solid transparent;background:linear-gradient(#1A1A1C,#1A1A1C) padding-box,linear-gradient(137deg,#f97316 0%,#fb923c 50%,#7c3aed 100%) border-box;overflow:hidden;z-index:1">
      <div style="padding:28px;height:100%;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box">
        <div style="color:rgba(255,255,255,.9)">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
        </div>
        <div>
          <div style="color:#fff;font-weight:500;font-size:20px;letter-spacing:-.025em;margin-bottom:12px">Studio</div>
          <p style="color:#9ca3af;font-size:14px;line-height:1.6;margin:0">Studio is where I define every single pixel. It is the hub for each canvas I deliver.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Card 3: violet → orange → dark purple -->
  <div style="position:relative;width:300px;flex:0 0 300px">
    <div style="position:absolute;inset:0;height:300px;border-radius:40px;opacity:.6;filter:blur(45px);background:linear-gradient(137deg,#a855f7 0%,#f97316 50%,#6d28d9 100%)"></div>
    <div style="position:relative;height:300px;border-radius:40px;border:8px solid transparent;background:linear-gradient(#1A1A1C,#1A1A1C) padding-box,linear-gradient(137deg,#a855f7 0%,#f97316 50%,#6d28d9 100%) border-box;overflow:hidden;z-index:1">
      <div style="padding:28px;height:100%;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box">
        <div style="color:rgba(255,255,255,.9)">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
        <div>
          <div style="color:#fff;font-weight:500;font-size:20px;letter-spacing:-.025em;margin-bottom:12px">Motion</div>
          <p style="color:#9ca3af;font-size:14px;line-height:1.6;margin:0">I use Motion to build lively prototypes, bridging the gap between views and code.</p>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
